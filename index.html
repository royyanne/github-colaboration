<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Collaboration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            text-align: center;
        }

        h1 {
            font-size: 40px;
            color: #222;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 40px;
        }

        .cards {
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .card {
            width: 350px;
            background: white;
            padding: 35px 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }

        .icon {
            font-size: 50px;
            margin-bottom: 20px;
        }

        .card h2 {
            color: #222;
            margin-bottom: 15px;
        }

        .card p {
            color: #666;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        button {
            border: none;
            background: #24292f;
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #000;
        }

        @media (max-width: 768px) {
            .cards {
                flex-direction: column;
                align-items: center;
            }

            .card {
                width: 100%;
                max-width: 350px;
            }

            h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>GitHub Collaboration</h1>
        <p class="subtitle">Praktik Kolaborasi dengan HTML & CSS</p>

        <div class="cards">

            <div class="card">
                <div class="icon">💻</div>

                <h2>HTML & CSS</h2>

                <p>
                    Membuat tampilan website sederhana menggunakan
                    HTML untuk struktur dan CSS untuk mempercantik tampilan.
                </p>

                <button>Learn More</button>
            </div>


            <div class="card">
                <div class="icon">🚀</div>

                <h2>GitHub Collaboration</h2>

                <p>
                    Berlatih bekerja sama dalam satu project menggunakan
                    GitHub, branch, commit, dan pull request.
                </p>

                <button>Get Started</button>
            </div>

        </div>

    </div>

</body>
</html>
